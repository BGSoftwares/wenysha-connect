# Load balancer + TLS terminator + static frontend.
#
# Login is stateless (JWT), so any backend replica can serve any request - no
# sticky sessions needed. Everything that must be shared between replicas
# (rate-limit counters, lockouts, MFA challenges) lives in Redis.
#
# nginx resolves "backend" once at start-up and balances across every replica
# Docker returns. After scaling or recreating backend containers, reload it:
#   docker compose exec frontend nginx -s reload

upstream backend_pool {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# First line of defence for credential endpoints, per client IP. Django applies
# its own per-IP throttle and per-account lockout behind this.
limit_req_zone $binary_remote_addr zone=auth_endpoints:10m rate=30r/m;

server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${DOMAIN};
    client_max_body_size 55m;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # nginx only inherits add_header into a location that defines none of its own,
    # so locations that add headers (see /media/) must repeat the security ones.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Report-Only first: watch the browser console for violations, then rename the header
    # to Content-Security-Policy to enforce. Add any extra origins you use (e.g. Supabase).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' blob:; connect-src 'self' wss://${DOMAIN} https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sign-in, MFA code entry and code resend: strict per-IP request limit.
    location ~ ^/api/auth/(login|mfa/verify|mfa/resend)/$ {
        limit_req zone=auth_endpoints burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client cannot forge its address; Django is
        # configured with NUM_PROXIES=1. If another proxy/CDN sits in front of this
        # nginx, restore the real address with set_real_ip_from / real_ip_header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout;
    }

    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        # Retry another replica only when this one is unreachable. nginx never
        # replays non-idempotent requests (POST) by default.
        proxy_next_upstream error timeout;
    }

    location /static/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # User uploads: never executable. Sandboxed CSP + nosniff mean even a malicious
    # file that slipped past validation cannot run script on this origin.
    # Only the public gallery/hero images are served directly. Everything else
    # (excuse notes, submissions, library books, learning files) is private and is
    # only reachable through authenticated API downloads, so block it here.
    location ~ ^/media/(attendance|library|learning_materials|learning_assignments|learning_submissions)/ {
        return 404;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /ws/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
