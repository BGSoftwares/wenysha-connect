name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libraries for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
      - run: pip install -r backend/requirements.txt
      - name: Run tests (SQLite, in-memory cache)
        working-directory: backend
        env:
          USE_SQLITE: "True"
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: localhost,testserver
        run: python manage.py test --noinput
      - name: Check for missing migrations
        working-directory: backend
        env:
          USE_SQLITE: "True"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # Reports issues without blocking merges; flip continue-on-error off once clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Committed-secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if real .env files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$' | grep -vE '\.(example|sample)$' || true)
          if [ -n "$tracked" ]; then
            echo "These env files are committed and must be removed (git rm --cached) and their secrets rotated:"
            echo "$tracked"
            exit 1
          fi
