name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libraries for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
      - run: pip install -r backend/requirements.txt
      - name: Run tests (SQLite, in-memory cache)
        working-directory: backend
        env:
          USE_SQLITE: "True"
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_SSL_REDIRECT: "False"  # the test client speaks plain http
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef-0123456789abcdef-xyz
          DJANGO_ALLOWED_HOSTS: localhost,testserver
        run: python manage.py test --noinput
      - name: Check for missing migrations
        working-directory: backend
        env:
          USE_SQLITE: "True"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef-0123456789abcdef-xyz
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
      # Test tooling is installed on the fly (not saved) so it never ends up in the production image.
      - name: Frontend tests
        run: |
          npm install --no-save --no-package-lock \
            vitest@2.1.9 jsdom@25.0.1 @testing-library/react@16.1.0 @testing-library/dom@10.4.0
          npm run test:ui

  docker-stack:
    name: Docker stack (build, start, smoke test, backup and restore)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:ci/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Prepare a throw-away deployment (secrets, certificate, settings)
        run: |
          mkdir -p ci-certs offsite backups
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" -keyout ci-certs/privkey.pem -out ci-certs/fullchain.pem
          sh scripts/generate-secrets.sh
          sed -i \
            -e "s|^DOMAIN=.*|DOMAIN=localhost|" \
            -e "s|^TLS_CERT_DIR=.*|TLS_CERT_DIR=$PWD/ci-certs|" \
            -e "s|^MYSQL_HOST=.*|MYSQL_HOST=mysql|" \
            -e "s|^MYSQL_DATABASE=.*|MYSQL_DATABASE=school_ci|" \
            -e "s|^MYSQL_USER=.*|MYSQL_USER=school_ci|" \
            -e "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=CiDbPassword2026x|" \
            -e "s|^BACKUP_REMOTE=.*|BACKUP_REMOTE=offsite:/offsite|" \
            deploy.env
          printf '\nRCLONE_CONFIG_OFFSITE_TYPE=local\nALLOW_LOCAL_BACKUP_REMOTE=1\n' >> deploy.env
          sed "s|^MYSQL_HOST=.*|MYSQL_HOST=127.0.0.1|" deploy.env > deploy.preflight.env

      - name: Start MySQL, then run the pre-deploy checks
        run: |
          docker compose --env-file deploy.env up -d --wait mysql
          bash scripts/preflight.sh deploy.preflight.env

      - name: docker compose up --build
        run: docker compose --env-file deploy.env up --build -d

      - name: Wait for the site to answer
        run: |
          for i in $(seq 1 60); do
            curl -ksf https://localhost/api/health/ >/dev/null && exit 0
            sleep 5
          done
          echo "Site did not become healthy in 5 minutes"; docker compose --env-file deploy.env ps -a; exit 1

      - name: Containers and nginx config
        run: |
          docker compose --env-file deploy.env ps -a
          docker compose --env-file deploy.env exec -T frontend nginx -t
          docker inspect --format '{{.State.ExitCode}}' "$(docker compose --env-file deploy.env ps -a -q migrate)" | grep -qx 0

      - name: Create an admin and run the smoke test
        run: |
          docker compose --env-file deploy.env exec -T backend python manage.py shell -c \
            "from django.contrib.auth.models import User; from core.models import Role, UserProfile; from core.caching import get_portal_state; admin=User.objects.create_superuser('ciadmin','admin-ci@example.org','Ci-Smoke-Pass-2026!'); assert get_portal_state(admin)['mfa_setup_required']; student=User.objects.create_user('cistudent','student-ci@example.org','Ci-Smoke-Pass-2026!'); UserProfile.objects.create(user=student,role=Role.objects.get_or_create(name='Student')[0],full_name='CI Student')"
          SMOKE_INSECURE=1 SMOKE_HTTP_URL=http://localhost SMOKE_USER=cistudent SMOKE_PASS='Ci-Smoke-Pass-2026!' \
            sh scripts/smoke-test.sh https://localhost

      - name: Default-password tool finds nothing wrong
        run: docker compose --env-file deploy.env exec -T backend python manage.py rotate_default_passwords --dry-run

      - name: Backup is encrypted, copied off-server and reported healthy
        run: |
          docker compose --env-file deploy.env exec -T backend python -c "from pathlib import Path; Path('/app/media/restore-check.txt').write_text('CI media restore check')"
          docker compose --env-file deploy.env run --rm -e BACKUP_ONCE=1 backup
          ls -l backups offsite
          ls backups/db-*.sql.gz.enc offsite/db-*.sql.gz.enc
          ls backups/media-*.tar.gz.enc offsite/media-*.tar.gz.enc
          ! ls backups/db-*.sql.gz 2>/dev/null | grep -q .   # no unencrypted copy left behind
          ! ls offsite/db-*.sql.gz 2>/dev/null | grep -q .
          ! ls backups/media-*.tar.gz 2>/dev/null | grep -q .
          ! ls offsite/media-*.tar.gz 2>/dev/null | grep -q .
          grep -q 'offsite=yes' backups/LAST_STATUS
          sh scripts/backup-status.sh ./backups

      - name: Restore brings back deleted data (proves the backup is usable)
        run: |
          docker compose --env-file deploy.env exec -T backend python manage.py shell -c \
            "from django.contrib.auth.models import User; User.objects.filter(username='cistudent').delete()"
          docker compose --env-file deploy.env exec -T backend rm -f /app/media/restore-check.txt
          SMOKE_INSECURE=1 SMOKE_USER=cistudent SMOKE_PASS='Ci-Smoke-Pass-2026!' sh scripts/smoke-test.sh https://localhost && exit 1 || echo "student is gone, as expected"
          echo RESTORE | sh scripts/restore.sh "$(ls offsite/db-*.sql.gz.enc | head -n 1)"
          echo RESTORE | sh scripts/restore-media.sh "$(ls offsite/media-*.tar.gz.enc | head -n 1)"
          docker compose --env-file deploy.env exec -T backend python -c "from pathlib import Path; assert Path('/app/media/restore-check.txt').read_text() == 'CI media restore check'"
          SMOKE_INSECURE=1 SMOKE_USER=cistudent SMOKE_PASS='Ci-Smoke-Pass-2026!' sh scripts/smoke-test.sh https://localhost

      - name: A wrong passphrase is refused and changes nothing
        run: |
          if echo RESTORE | BACKUP_ENCRYPTION_PASSPHRASE=wrong-passphrase sh scripts/restore.sh "$(ls offsite/db-*.sql.gz.enc | head -n 1)"; then
            echo "restore with a wrong passphrase should have failed"; exit 1
          fi
          if echo RESTORE | BACKUP_ENCRYPTION_PASSPHRASE=wrong-passphrase sh scripts/restore-media.sh "$(ls offsite/media-*.tar.gz.enc | head -n 1)"; then
            echo "media restore with a wrong passphrase should have failed"; exit 1
          fi
          docker compose --env-file deploy.env exec -T backend python -c "from pathlib import Path; assert Path('/app/media/restore-check.txt').read_text() == 'CI media restore check'"
          SMOKE_INSECURE=1 SMOKE_USER=cistudent SMOKE_PASS='Ci-Smoke-Pass-2026!' sh scripts/smoke-test.sh https://localhost

      - name: Show logs if anything failed
        if: failure()
        run: docker compose --env-file deploy.env logs --no-color --tail=120

      - name: Tear down
        if: always()
        run: docker compose --env-file deploy.env down -v

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # Reports issues without blocking merges; flip continue-on-error off once clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-gate.mjs

  secrets:
    name: Committed-secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if real .env files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$' | grep -vE '\.(example|sample)$' || true)
          if [ -n "$tracked" ]; then
            echo "These env files are committed and must be removed (git rm --cached) and their secrets rotated:"
            echo "$tracked"
            exit 1
          fi
