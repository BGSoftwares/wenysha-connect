services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./deploy.env
        required: false
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy.env}
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in deploy.env}
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      DJANGO_SECURE_HSTS_PRELOAD: "False"
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST in deploy.env}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in deploy.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy.env}
      USE_SQLITE: "False"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: wss://${DOMAIN}/ws/notifications/
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR in deploy.env}:/etc/nginx/certs:ro
      - media_data:/usr/share/nginx/html/media:ro
    restart: unless-stopped

volumes:
  media_data:
