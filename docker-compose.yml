x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: ./deploy.env
      required: false
  environment:
    DJANGO_DEBUG: "False"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy.env}
    DJANGO_ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in deploy.env}
    DJANGO_SECURE_SSL_REDIRECT: "True"
    DJANGO_SECURE_HSTS_SECONDS: "31536000"
    DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
    DJANGO_SECURE_HSTS_PRELOAD: "False"
    CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST in deploy.env}
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy.env}
    MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in deploy.env}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy.env}
    USE_SQLITE: "False"
    # Shared state for every replica: rate limits, lockouts, MFA challenges, profile cache.
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy.env}@redis:6379/0
    # nginx is the one trusted proxy in front of Django (used for real client IPs).
    NUM_PROXIES: "1"
    MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES-Admin}

services:
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy volatile-lru --save "" --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy.env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Runs once per deploy, before any backend replica starts, so replicas never
  # race each other applying migrations.
  migrate:
    <<: *backend
    command: python manage.py migrate --noinput
    restart: "no"

  backend:
    <<: *backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: wss://${DOMAIN}/ws/notifications/
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR in deploy.env}:/etc/nginx/certs:ro
      - media_data:/usr/share/nginx/html/media:ro
    restart: unless-stopped

volumes:
  media_data:
