version: "3.9"

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
        VITE_WS_URL: ws://localhost:8000/ws/notifications/
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
