# Used only by CI (and handy for a local rehearsal): adds a throw-away MySQL next to the real compose file
# and a local folder that stands in for the off-server backup destination.
#   COMPOSE_FILE=docker-compose.yml:ci/docker-compose.ci.yml docker compose --env-file deploy.env up --build -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}-root
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    depends_on:
      mysql:
        condition: service_healthy

  backup:
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./offsite:/offsite
